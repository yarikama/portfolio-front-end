name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch or PR replaces a run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Type-checks (tsc) and bundles, as Vercel does.
      - run: npm run build
